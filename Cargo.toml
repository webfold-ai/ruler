[package]
name = "ruler"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Text layout kernel — Ruler (O(1) line-break fold over glyph advances), Box, pdf-base14 AFM font metrics. Zero deps."
repository = "https://github.com/webfold-ai/ruler"
readme = "README.md"
keywords = ["text-layout", "line-breaking", "pdf", "afm", "font-metrics"]
categories = ["text-processing", "graphics"]
rust-version = "1.88"
publish = false

[features]
default = ["pdf-base14"]
pdf-base14 = []

[workspace]
