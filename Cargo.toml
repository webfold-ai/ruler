[package]
name = "ruler"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Text geometry for Rust: prepared glyph advances, greedy line breaking, caret hit testing and paragraph-local updates."
repository = "https://github.com/webfold-ai/ruler"
readme = "README.md"
keywords = ["text-layout", "line-breaking", "pdf", "afm", "font-metrics"]
categories = ["text-processing", "graphics"]
rust-version = "1.88"
publish = false

[features]
default = ["pdf-base14"]
pdf-base14 = []

[workspace]
