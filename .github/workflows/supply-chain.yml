name: Supply chain

on:
  pull_request:
    paths:
      - "**/*.toml"
      - "**/*.lock"
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit the library and fuzz lockfiles
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings -f fuzz/Cargo.lock

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.4
      - name: Check the library policy
        run: cargo deny check advisories bans licenses sources
      - name: Check the fuzz crate policy
        run: cargo deny --manifest-path fuzz/Cargo.toml check advisories bans licenses sources

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM
        # --override-filename is a prefix; cargo-cyclonedx appends the extension.
        run: cargo cyclonedx --format json --override-filename ruler.sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruler-cyclonedx-sbom
          path: ruler.sbom.json
          retention-days: 90

  evidence:
    # Writes the caretaker evidence record for the supply-chain gate (same event shape caretaker
    # consumes from other repositories).
    name: Caretaker evidence
    if: always()
    needs: [audit, deny, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write caretaker evidence
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          DENY_RESULT: ${{ needs.deny.result }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "event": "ptyktos.supply_chain.audit",
              "ts": datetime.now(timezone.utc).isoformat(),
              "repo": os.environ["REPOSITORY"],
              "audit": os.environ["AUDIT_RESULT"],
              "deny": os.environ["DENY_RESULT"],
              "sbom_path": "ruler.sbom.json",
          }
          with open("evidence/supply-chain.json", "w") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence
          path: evidence/supply-chain.json
          retention-days: 90
