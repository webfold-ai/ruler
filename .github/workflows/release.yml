name: Release

# Runs when a version tag is pushed. The release artifact is the packaged crate (`cargo package`).
# The crate is not published to crates.io (`publish = false`).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing and artifact attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v${PACKAGE_VERSION}" = "${TAG_NAME}"
      - name: Test
        run: cargo test --locked
      - name: Package the crate
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cargo package --locked
          mkdir -p dist
          cp target/package/ruler-*.crate "dist/ruler-${TAG_NAME}.crate"
          cp LICENSE-MIT LICENSE-APACHE README.md dist/
          (cd dist && sha256sum "ruler-${TAG_NAME}.crate" > SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign release artifacts (keyless sigstore)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          # One self-contained bundle per artifact. The identity is checked at verification
          # time (see docs/SUPPLY-CHAIN.md), not when signing.
          for f in "ruler-${TAG_NAME}.crate" SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/ruler-*.crate"
      - name: Copy provenance bundle to the release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "dist/ruler-${TAG_NAME}.crate.intoto.jsonl"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG_NAME" \
            "ruler-${TAG_NAME}.crate" \
            "ruler-${TAG_NAME}.crate.sigstore.json" \
            "ruler-${TAG_NAME}.crate.intoto.jsonl" \
            SHA256SUMS SHA256SUMS.sigstore.json \
            --generate-notes
